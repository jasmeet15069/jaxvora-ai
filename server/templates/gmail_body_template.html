<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{subject}}</title>
  </head>
  <body style="margin:0;padding:0;background:#07080f;color:#eef2ff;font-family:Arial,Helvetica,sans-serif;">
    <div style="display:none;max-height:0;overflow:hidden;color:#07080f;opacity:0;">{{preheader}}</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#07080f;margin:0;padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:680px;background:#10121c;border:1px solid #252844;border-radius:18px;overflow:hidden;">
            <tr>
              <td style="padding:26px 28px 18px 28px;background:#111426;border-bottom:1px solid #252844;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="vertical-align:middle;">
                      <img src="cid:{{logo_cid}}" width="52" height="52" alt="Jaxvora" style="display:block;border:0;border-radius:14px;background:#171a2d;">
                    </td>
                    <td width="14"></td>
                    <td style="vertical-align:middle;">
                      <div style="font-size:22px;line-height:28px;font-weight:800;letter-spacing:0;color:#ffffff;">Jaxvora AI</div>
                      <div style="font-size:13px;line-height:20px;color:#9aa3c7;">Autonomous multi-agent platform</div>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:30px 28px 10px 28px;">
                <div style="font-size:12px;line-height:18px;font-weight:700;text-transform:uppercase;letter-spacing:0.12em;color:#8f86ff;">Jaxvora update</div>
                <h1 style="margin:8px 0 18px 0;font-size:24px;line-height:32px;font-weight:800;color:#ffffff;">{{subject}}</h1>
                <div style="font-size:16px;line-height:26px;color:#e8ebff;">
                  {{body_html}}
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding:22px 28px 28px 28px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-top:1px solid #252844;">
                  <tr>
                    <td style="padding-top:18px;font-size:12px;line-height:20px;color:#8b92b6;">
                      Sent by Jaxvora AI from {{sender}}.
                    </td>
                    <td align="right" style="padding-top:18px;font-size:12px;line-height:20px;color:#6f7599;">
                      {{year}}
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
